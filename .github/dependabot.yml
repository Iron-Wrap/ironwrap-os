# Dependabot for the ecosystems this repository has: GitHub Actions, npm (every
# package-lock.json), and pip (frappe-apps/ironwrap_roofing/pyproject.toml).
#
# Patch and minor updates arrive as one grouped PR per ecosystem; majors come
# one PR each. Version updates run monthly: each one costs a full CI run, and
# security updates do not wait for this schedule (IRW-R8 CI cost).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: npm
    directories: ['**/*']
    schedule:
      interval: monthly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: pip
    directories: ['**/*']
    schedule:
      interval: monthly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]
