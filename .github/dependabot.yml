# Dependabot for the ecosystems this repository has: GitHub Actions, npm (every
# package-lock.json), and pip (frappe-apps/ironwrap_roofing/pyproject.toml).
#
# Patch and minor updates arrive as one grouped PR per ecosystem; majors come
# one PR each. Version updates run monthly: each one costs a full CI run, and
# security updates do not wait for this schedule (IRW-R8 CI cost).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  # The PWA bundle is held to the paired-device Lighthouse budget. react/react-dom 19.3 and
  # zod 4.6 add about 17 KB gzip to the critical path (LCP +90-250 ms, performance 0.85 < 0.9 on
  # Dependabot #383), so their minor updates wait for a change that keeps the budget; patches
  # still arrive. The server packages are not affected and keep every update.
  #
  # @playwright/test keeps every update. Its Chromium no longer moves the budget: the
  # paired-device Lighthouse leg measures with the Chrome for Testing build pinned in
  # app/scripts/chrome-for-testing.json, so a Playwright minor changes only the browser the e2e
  # suites run. Moving the measuring browser is a deliberate edit of that pin, measured on the
  # current bundle first, never a Dependabot update.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: react
        update-types: ['version-update:semver-minor']
      - dependency-name: react-dom
        update-types: ['version-update:semver-minor']
      - dependency-name: zod
        update-types: ['version-update:semver-minor']
    # Group names must differ between npm entries: Dependabot merged two same-named groups into
    # one cross-directory PR (#406) and applied neither entry's ignore list to it.
    groups:
      app-patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: npm
    directories: ['/agent-host', '/mcp/*', '/release-issuer', '/workers-bus']
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      server-patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: pip
    directories: ['**/*']
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]
