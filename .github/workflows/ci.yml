name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            workers-bus/package-lock.json
            mcp/erpnext-roofing-mcp/package-lock.json
            mcp/ironwrap-bus-mcp/package-lock.json
            mcp/newo-mcp/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate DocType contract (50 DocTypes, Frappe-only link targets)
        run: node tools/validate-erpnext-doctypes.mjs
      - name: Validate Hermes roles and manifest against the MCP tool inventory
        run: node tools/validate-hermes-config.mjs
      - name: Validate tenant configs (no secrets, isolated namespaces)
        run: node tools/validate-tenant-config.mjs
      - name: Validate staged Newo contracts, hashes, evidence inventory, and safe defaults
        run: node tools/validate-newo-config.mjs
      - name: Validate documentation authority, privacy, and links
        run: node tools/validate-documentation.mjs
      - name: Test Newo production gate refusal while provider evidence is pending
        run: node --test tools/validate-newo-config.test.mjs
      - name: Test tenant runtime preflight
        run: node --test tools/validate-tenant-runtime.test.mjs
      - name: Validate IronWrap runtime tenant identity
        env:
          IRONWRAP_TENANT_CONFIG: ironwrap
          APP_TENANT_ID: ironwrap
          APP_TENANT_NAME: IronWrap OS
          APP_TENANT_BRAND: IronWrap
          APP_LOCALE: en-CA
          APP_TIME_ZONE: America/Edmonton
          APP_CURRENCY: CAD
          FROM_EMAIL: sales@ironwrapexteriors.com
          APP_BFF_ENABLED: "false"
          APP_CUSTOMER_PORTAL_ENABLED: "false"
        run: node tools/validate-tenant-runtime.mjs
      - name: Prove deterministic AppliCad extraction
        run: node tools/applicad-xml-proof.mjs --check

      - name: Install pinned Python validation tools
        run: python -m pip install --disable-pip-version-check ruff==0.13.0 build==1.4.0 ./frappe-apps/ironwrap_roofing
      - name: Install erpnext-roofing-mcp dependencies
        run: npm ci --prefix mcp/erpnext-roofing-mcp
      - name: Test Frappe application contracts without a site
        working-directory: frappe-apps/ironwrap_roofing
        run: python -m unittest discover -s tests -t .
      - name: Lint and compile Frappe application
        working-directory: frappe-apps/ironwrap_roofing
        run: |
          ruff check ironwrap_roofing tests
          python -m compileall -q ironwrap_roofing tests
      - name: Build installable Frappe wheel
        working-directory: frappe-apps/ironwrap_roofing
        run: python -m build --wheel

      - name: Test erpnext-roofing-mcp
        run: npm test --prefix mcp/erpnext-roofing-mcp
      - name: Test ironwrap-bus-mcp
        run: npm ci --prefix mcp/ironwrap-bus-mcp && npm test --prefix mcp/ironwrap-bus-mcp
      - name: Test role-filtered newo-mcp
        run: npm ci --prefix mcp/newo-mcp && npm test --prefix mcp/newo-mcp

      - name: Install PWA dependencies
        run: npm ci --prefix app
      - name: Validate and build PWA assets
        run: |
          npm run typecheck --prefix app
          npm run lint --prefix app
          npm test --prefix app
          npm run format:check --prefix app
          npm run build --prefix app
      - name: Install Playwright Chromium for app e2e
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run app Playwright e2e (PWA suite)
        run: npm run test:pwa --prefix app

      - name: Install Worker dependencies
        run: npm ci --ignore-scripts --prefix workers-bus
      - name: Generate Worker binding types
        run: npm run typegen --prefix workers-bus
      - name: Apply every Worker migration to an isolated local D1 state
        run: npm run db:migrate:local --prefix workers-bus -- --persist-to "$RUNNER_TEMP/ironwrap-d1"
      - name: Test Worker bus
        run: npm test --prefix workers-bus
      - name: Typecheck Worker bus
        run: npm run typecheck --prefix workers-bus
      - name: Bundle Worker without deploying
        run: npm run deploy --prefix workers-bus -- --dry-run
      - name: Audit shipped Node dependencies
        run: |
          npm audit --omit=dev --prefix app
          npm audit --omit=dev --prefix workers-bus
          npm audit --omit=dev --prefix mcp/erpnext-roofing-mcp
          npm audit --omit=dev --prefix mcp/ironwrap-bus-mcp
          npm audit --omit=dev --prefix mcp/newo-mcp

      - name: Test production-readiness verifier
        run: node --test tools/production-readiness.test.mjs
      - name: Test launch-proof release evidence runner
        run: node --test tools/launch-proof.test.mjs
      - name: Validate repository production contract
        run: node tools/production-readiness.mjs contract
      - name: Validate shell syntax
        run: find deploy workers-bus -path '*/node_modules' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: No em dashes in Hermes and agent-facing configuration
        run: |
          if grep -rl $'—' hermes/ config/ deploy/; then
            echo "em dash found in agent-facing content" >&2; exit 1
          fi
