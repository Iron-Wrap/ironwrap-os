# CI: a self-contained copy of the Mindburn CI v2 contract.
#
# This repository lives outside the Mindburn-Labs org, so it cannot call
# Mindburn-Labs/platform-actions/.github/workflows/ci.yml@v2. It carries the
# same shape inline; the dependency scan is copied from that file at tag v2
# (d5a0eb5c1ffe8836f94cc679b36ed7a6be3d9e97).
#
# `make check` (IRO-267: 34-40 minutes end to end, budget was 60) is split into
# parallel jobs that together cover exactly what it covers:
#   contracts         `make check-contracts` (validators, tool/MCP tests, Frappe,
#                     audit, static checks).
#   pwa               `make check-pwa` (the app: typecheck, lint, vitest, build).
#   worker            a 4-way matrix, one `make worker-shard` each; no shard reads
#                     or writes D1, so shards need no shared state or ordering.
#   worker-contract   `make worker-contract` - typegen, the db:migrate:local smoke,
#                     typecheck, a real app/ build, and the deploy dry-run against
#                     it (an empty app/dist dry-runs clean but validates none of
#                     wrangler's asset limits - IRO-267 revision 2). Nothing under
#                     workers-bus/src imports from app/, so it is still not part
#                     of the shard split, but it does need app's node_modules.
#   e2e               a 3-way matrix of balanced suite groups via
#                     `make e2e-suite SUITE="<script> <script> ..."`: one bundle
#                     build and one Chromium install per leg, then the group's
#                     suites in sequence, as `make e2e` runs them locally (each
#                     suite pins its own ACCEPTANCE_PORT and runs single-worker,
#                     and CI never reuses a server). Seventeen one-suite legs
#                     spent half of every run's billed minutes on setup and
#                     per-job rounding (IRW-R8 CI cost).
#   evidence          needs both `pwa` and `worker`: the capability evidence receipt
#                     (`make evidence-receipt`) requires both test outputs on one
#                     filesystem, so this job downloads both artifacts, merges the
#                     four worker shard TAPs into one (tools/merge-worker-tap.mjs -
#                     a plain `cat` would silently bind the receipt to one shard's
#                     count) and writes the receipt.
#   secret-scan       `make secret-scan` (pinned gitleaks over the tracked tree).
#   dependency-scan   pull requests and merge groups only: fails on a HIGH or
#                     CRITICAL vulnerability that is present at head and absent
#                     at base. Inherited findings are Dependabot's job.
#   paired-device-lighthouse  a timing budget, so it keeps a runner of its own.
#   changes           tools/ci-scope.mjs: for a pull request, whether the PWA
#                     bundle legs (`app`: e2e, paired-device-lighthouse) and the
#                     test suites (`code`: pwa, worker, worker-contract,
#                     evidence) have anything new to prove. A push to main, a
#                     merge group and a manual run always prove everything, so
#                     the commit Deploy promotes carries the full gate.
#   gate              always runs; fails if any job it needs failed or was
#                     cancelled, or was skipped without its scope saying so.
#
# `make check` itself is unchanged and stays the local, sequential entry point.
# tools/ci-workflow.test.mjs derives every `make <target>` invocation this
# workflow makes and asserts it covers exactly what `make check e2e secret-scan`
# covers - the "no check removed" proof, enforced in code rather than a PR table.
#
# `validate-and-test` reports the check name ruleset 20652163 still requires; it
# passes exactly when `gate` passed. Delete it once the ruleset requires `gate`.
# The workflow name `CI` is what deploy.yml's workflow_run listens to, and
# deploy.yml reads these job names back - no matrix job (named e.g. `worker (1)`
# or `e2e (test:pwa)`) may ever appear in deploy.yml's job-names list, because
# tools/release-promotion.mjs requires exactly one job per requested name.
#
# No workflow-level path filters, so `gate` reports on every change; scoping is
# per job, through `changes`, and gate checks every skip against it. The single
# required status check is `gate`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # tools/release-promotion.mjs:260 reads a run's jobs from
  # actions/runs/<id>/jobs?per_page=100, unpaged. Raising this raises the
  # static-plus-matrix job count (tools/ci-workflow.test.mjs asserts it stays
  # at or under 100); the bound belongs here, where jobs are created, not there,
  # where they are read.
  WORKER_SHARDS: 4
  # The pre-split Worker suite's "# tests" total (IRO-267 revision 2). The shard
  # TAP names no test file, so tools/merge-worker-tap.mjs can't check the file
  # set the shards ran - this floor is what stops four well-formed TAPs that
  # between them ran far fewer than 151 files from still producing an accepted
  # capability evidence receipt.
  WORKER_TEST_FLOOR: 1670

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      code: ${{ steps.scope.outputs.code }}
    steps:
      # Depth 2 so HEAD^ resolves: a pull request checks out the merge commit,
      # whose first parent is the base branch tip.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Decide what this change has to prove
        id: scope
        run: node tools/ci-scope.mjs

  contracts:
    runs-on: ubuntu-latest
    # Measured 10m21s-11m23s on main before the pinned SQLite CLI; the D1 backup,
    # recovery and drill proofs spawn sqlite3 about 1.4k times per run and took
    # about 37% longer with it (run 39030414970 hit the old 15-minute cap at
    # ~14m57s with every test passing), so the cap leaves room for runner noise.
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned SQLite CLI for complete recovery proofs
        run: make ci-sqlite

      - name: make check-contracts
        run: make check-contracts

  pwa:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: make check-pwa
        run: make check-pwa

      - name: Upload the app test log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-tests-log
          path: tmp/check/app-tests.log
          retention-days: 7
          if-no-files-found: error

  worker:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers-bus/package-lock.json

      - name: make worker-shard
        run: make worker-shard SHARD=${{ matrix.shard }}/${{ env.WORKER_SHARDS }}

      - name: Upload this shard's TAP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-tap-${{ matrix.shard }}
          path: tmp/check/worker-tests-${{ matrix.shard }}-${{ env.WORKER_SHARDS }}.tap
          retention-days: 7
          if-no-files-found: error

  # The typegen/typecheck/dry-run contract plus the db:migrate:local smoke, via
  # `make worker-contract`. Nothing under workers-bus/src imports from app/, but
  # (IRO-267 revision 2) the deploy dry-run now validates the real PWA bundle
  # instead of an empty app/dist, so this job also builds app/ and its cache key
  # must cover both lockfiles. Nothing under workers-bus/ reads the D1 database
  # this persists (grep for persist-to|persistTo|tmp/check|.wrangler finds
  # nothing), so it is not a test input to anything else and needs no shared
  # state with the worker shards.
  worker-contract:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            workers-bus/package-lock.json
            app/package-lock.json

      - name: make worker-contract
        run: make worker-contract

  # Balanced groups of Playwright PWA suites, one bundle build per leg. Each suite
  # pins its own ACCEPTANCE_PORT and runs single-worker, and CI never reuses a
  # server, so a group runs its suites one after another on one runner, exactly as
  # `make e2e` runs all of them locally. Grouped by measured leg time (CI run
  # 38202713134) so no leg outlasts `contracts`; e2e-suite runs every suite in its
  # group and fails if any failed.
  e2e:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        group:
          - "test:pwa test:pwa:owner-configuration test:pwa:people test:pwa:capabilities"
          - "test:pwa:manual-measurements test:pwa:quote-revision test:pwa:documents test:pwa:onboarding test:pwa:board"
          - "test:pwa:sales-intake test:pwa:decisions test:pwa:safety test:pwa:placement test:pwa:capabilities:accounting test:pwa:job-history test:pwa:accounting test:pwa:service-calls"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The ubuntu runner image already carries Chromium's system libraries, so
      # only the browser itself is installed, from this cache when the lockfile
      # (and so the Playwright version) is unchanged (IRO-269).
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('app/package-lock.json') }}

      - name: make e2e-suite
        run: make e2e-suite SUITE="${{ matrix.group }}"

  # Exact-source capability evidence, bound to the pwa and worker test logs. The
  # identity check this performs in CI (tools/validate-documentation.mjs's
  # ciCheckIdentity) needs a plain checkout: no `ref:`, no `fetch-depth: 2`.
  evidence:
    needs: [changes, pwa, worker]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download the app test log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-tests-log
          path: tmp/check

      - name: Download the worker shard TAPs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: worker-tap-*
          path: tmp/check
          merge-multiple: true

      - name: Merge the worker shard TAPs
        run: node tools/merge-worker-tap.mjs --shards ${{ env.WORKER_SHARDS }} --min-tests ${{ env.WORKER_TEST_FLOOR }} --output tmp/check/worker-tests.tap tmp/check/worker-tests-*-${{ env.WORKER_SHARDS }}.tap

      - name: Capability evidence receipt
        env:
          # The capability evidence receipt binds the exact source under test.
          CAPABILITY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CAPABILITY_BASE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
        run: make evidence-receipt

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: make secret-scan
        run: make secret-scan

  # The paired-device budget is a timing measurement, so it gets a runner of its
  # own. Sharing one with the validator, unit, Playwright and Python suites left
  # ~10 minutes of prior work on the machine before Lighthouse started and
  # pushed the job into its own 20-minute timeout on slower runners.
  paired-device-lighthouse:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Depth 2 so HEAD^ resolves. For a pull request that is the base branch tip
      # `actions/checkout` merged into, and for a push it is the previous commit on the
      # branch, which is the comparison the scope decision below wants in both cases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Runs that changed nothing under `app/` measure a byte-identical bundle, so their
      # red was runner noise (ELEC-106). The rationale, and why this does not weaken the
      # budget, is in app/scripts/lighthouse-scope.mjs.
      - name: Decide whether the PWA bundle can have changed
        id: scope
        run: node app/scripts/lighthouse-scope.mjs
      - name: Install app dependencies
        if: steps.scope.outputs.measure == 'true'
        run: npm ci --prefix app
      # The budget is read on the one Chrome for Testing build pinned in
      # app/scripts/chrome-for-testing.json, never on Playwright's Chromium, so a Playwright
      # update cannot move the reading (app/scripts/lighthouse-chrome.mjs has the rationale).
      # The runner image ships Google Chrome and so its system libraries; only the pinned
      # browser is installed, from this cache while the pin is unchanged, and the install
      # step hands its executable to the measurement as LHCI_CHROME_PATH.
      - name: Cache the pinned Chrome for Testing
        if: steps.scope.outputs.measure == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chrome-for-testing
          key: ${{ runner.os }}-chrome-for-testing-${{ hashFiles('app/scripts/chrome-for-testing.json') }}
      # The downloader has no socket timeout, so a stalled cold download is cut off here
      # rather than at the job's own timeout.
      - name: Install the pinned Chrome for Testing
        if: steps.scope.outputs.measure == 'true'
        timeout-minutes: 5
        run: node app/scripts/lighthouse-chrome.mjs
      - name: Run paired-device Lighthouse thresholds
        if: steps.scope.outputs.measure == 'true'
        run: npm run test:lighthouse --prefix app
      # The gate reports only the assertions it failed, so print every reading either way.
      - name: Report paired-device Lighthouse readings
        if: always()
        env:
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "scope: ${SCOPE_REASON:-the scope step did not run}"
          summary=app/.lighthouseci/lighthouse-summary.json
          if [ ! -f "$summary" ]; then
            echo "no Lighthouse summary was produced"
            exit 0
          fi
          # shellcheck disable=SC2016 # the node script is single-quoted on purpose
          node -e '
            const summary = require("./" + process.argv[1]);
            const round = (value) => Math.round(value * 1000) / 1000;
            console.log(`url ${summary.url} over ${summary.runs} runs`);
            for (const [audit, reading] of Object.entries(summary.aggregate)) {
              console.log(
                `${audit.padEnd(28)} median ${String(round(reading.median)).padEnd(10)}` +
                  ` runs ${reading.values.map(round).join(", ")}`,
              );
              if (reading.rawValues) {
                const rawAudit = `${audit} raw`;
                console.log(
                  `${rawAudit.padEnd(28)} median ${String(round(reading.rawMedian)).padEnd(10)}` +
                    ` runs ${reading.rawValues.map(round).join(", ")}`,
                );
              }
            }
            const runner = summary.runner;
            if (runner) {
              console.log(
                `${"benchmarkIndex".padEnd(28)} median ${String(round(runner.benchmarkIndex.median)).padEnd(10)}` +
                  ` runs ${runner.benchmarkIndex.values.map(round).join(", ")}`,
              );
            }
          ' "$summary"

      - name: Preserve paired-device Lighthouse evidence
        if: always() && steps.scope.outputs.measure == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-device-lighthouse-${{ github.run_attempt }}
          path: app/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  dependency-scan:
    name: dependency scan
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      OSV_SCANNER_VERSION: v2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Install osv-scanner
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            --output "${bin}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${bin}/osv-scanner" | sha256sum --check --strict
          chmod +x "${bin}/osv-scanner"
          echo "${bin}" >>"${GITHUB_PATH}"

      - name: Scan base and head
        run: |
          # Exit 1 means "vulnerabilities found", which the next step judges.
          # Anything else is a scanner failure and fails the job.
          scan() {
            osv-scanner scan source --recursive --no-call-analysis=all --allow-no-lockfiles \
              --format json --output-file "$2" "$1" || [[ $? -eq 1 ]]
          }
          scan base base.json
          scan head head.json

      - name: Fail on HIGH or CRITICAL vulnerabilities new in this change
        run: |
          # One line per (ecosystem, package, advisory) at HIGH or CRITICAL:
          # CVSS >= 7.0, or a GitHub advisory rated HIGH/CRITICAL. The version
          # is reported but is not part of the key, so a bump that leaves an
          # advisory open is not counted as new.
          findings() {
            jq -r '
              .results[]?.packages[]? as $p
              | $p.groups[]? as $g
              | select(
                  ((($g.max_severity // "") | tonumber?) // 0) >= 7
                  or any(
                    $p.vulnerabilities[]? | select(.id as $id | $g.ids | index($id));
                    (.database_specific.severity? // "" | ascii_upcase) | IN("HIGH", "CRITICAL")
                  )
                )
              | $g.ids[] as $id
              | [$p.package.ecosystem, $p.package.name, $id, $p.package.version, ($g.max_severity // "")]
              | @tsv
            ' "$1" | sort -u
          }
          findings base.json | cut -f1-3 >base.keys
          findings head.json >head.tsv
          awk -F'\t' 'FILENAME == ARGV[1] { seen[$0]; next } !(($1 FS $2 FS $3) in seen)' base.keys head.tsv >new.tsv
          inherited=$(( $(wc -l <head.tsv) - $(wc -l <new.tsv) ))
          if [[ "${inherited}" -gt 0 ]]; then
            echo "::notice::${inherited} HIGH/CRITICAL finding(s) already exist on the base branch; they are not caused by this change"
          fi
          if [[ -s new.tsv ]]; then
            while IFS=$'\t' read -r ecosystem name id version severity; do
              echo "::error::${ecosystem} ${name}@${version}: ${id} (CVSS ${severity:-n/a}) is new in this change"
            done <new.tsv
            exit 1
          fi
          echo "no new HIGH/CRITICAL vulnerabilities"

  gate:
    if: always()
    needs:
      [
        changes,
        contracts,
        pwa,
        worker,
        worker-contract,
        e2e,
        evidence,
        secret-scan,
        paired-device-lighthouse,
        dependency-scan,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skip passes only where it is legitimate: dependency-scan outside pull
      # requests and merge groups, and a scoped job whose scope output from
      # `changes` is exactly "false". A stray `if:` on any other job, or a scoped
      # job skipped while its scope said to run (or `changes` itself failing),
      # fails here (IRO-267 blocker 12, revision 2 step 22).
      - name: Require every job to succeed, or to be skipped where its scope allows
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -r '"scope: app=\(.changes.outputs.app // "unset") code=\(.changes.outputs.code // "unset")"' <<<"${NEEDS}"
          jq -e '
            {
              "e2e": "app",
              "paired-device-lighthouse": "app",
              "pwa": "code",
              "worker": "code",
              "worker-contract": "code",
              "evidence": "code"
            } as $scoped
            | (.changes.outputs // {}) as $scope
            | to_entries
            | all(
                .value.result == "success"
                or (.value.result == "skipped"
                    and (.key == "dependency-scan"
                         or ($scoped[.key] != null and $scope[$scoped[.key]] == "false")))
              )
          ' <<<"${NEEDS}" >/dev/null

  validate-and-test:
    if: always()
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pass exactly when gate passed
        env:
          GATE: ${{ needs.gate.result }}
        run: |
          echo "gate: ${GATE}"
          test "${GATE}" = success
