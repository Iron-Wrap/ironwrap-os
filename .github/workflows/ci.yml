name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Green runs on main sit at 19-28 minutes against this cap (33141006840, 33137923650,
    # 33135289861), so every suite added since #175 raised it to 30 has been spending someone
    # else's headroom. Raised rather than trimmed: the job died at "Test production-readiness
    # verifier" with every validator, e2e project and Worker suite already green, which is a
    # budget problem, not a slow check worth cutting.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            workers-bus/package-lock.json
            mcp/erpnext-roofing-mcp/package-lock.json
            mcp/ironwrap-bus-mcp/package-lock.json
            mcp/newo-mcp/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate DocType contract (79 DocTypes, Frappe-only link targets)
        run: node tools/validate-erpnext-doctypes.mjs
      - name: Validate Hermes roles and manifest against the MCP tool inventory
        run: node tools/validate-hermes-config.mjs
      - name: Validate tenant configs (no secrets, isolated namespaces)
        run: node tools/validate-tenant-config.mjs
      - name: Validate staged Newo contracts, hashes, evidence inventory, and safe defaults
        run: node tools/validate-newo-config.mjs
      - name: Validate lead-triage shadow authority policy and adversarial corpus
        run: node tools/validate-lead-triage-shadow-authority.mjs
      - name: Validate documentation authority, privacy, and links
        run: node tools/validate-documentation.mjs
      - name: Validate every bounded-rail issuer key is provisioned and documented
        run: node tools/validate-site-config-pins.mjs
      - name: Test site-config pin validator
        run: node --test tools/validate-site-config-pins.test.mjs
      - name: Validate per-rail Frappe credential isolation end to end
        run: node tools/validate-rail-credential-isolation.mjs
      - name: Test rail credential isolation validator
        run: node --test tools/validate-rail-credential-isolation.test.mjs
      - name: Validate the Facet blank-quote contract against Customer Quote
        run: node tools/validate-facet-blank-quote-contract.mjs
      - name: Test Facet blank-quote contract validator
        run: node --test tools/validate-facet-blank-quote-contract.test.mjs
      - name: Test stale capability evidence rejection
        run: node --test tools/validate-documentation.test.mjs
      - name: Test Newo production gate refusal while provider evidence is pending
        run: node --test tools/validate-newo-config.test.mjs
      - name: Test lead-triage shadow authority config validator
        run: node --test tools/validate-lead-triage-shadow-authority.test.mjs
      - name: Test tenant runtime preflight
        run: node --test tools/validate-tenant-runtime.test.mjs
      - name: Test pipeline template seeding (every config/pipelines document parses)
        run: node --test tools/seed-pipeline.test.mjs
      - name: Test tenant config generation from the clone template
        run: node --test tools/generate-tenant-config.test.mjs
      - name: Test tenant Worker config derivation (no source-tenant references survive)
        run: node --test tools/generate-tenant-worker-config.test.mjs
      - name: Test local .dev.vars composition (port overrides + example scaffold)
        run: node --test deploy/local/dev-vars.test.mjs
      - name: Validate tenant-leakage check 5 sweeps every doctype the Worker writes
        run: node tools/validate-ingest-doctype-coverage.mjs
      - name: Test ingest doctype coverage guard
        run: node --test tools/validate-ingest-doctype-coverage.test.mjs
      - name: Test the cross-tenant marker sweep
        run: node --test deploy/local/frappe-marker-sweep.test.mjs
      - name: Test local Frappe provisioner per-site scratch isolation
        run: node --test deploy/local/frappe-init.test.mjs
      - name: Validate IronWrap runtime tenant identity
        env:
          IRONWRAP_TENANT_CONFIG: ironwrap
          APP_TENANT_ID: ironwrap
          APP_TENANT_NAME: IronWrap OS
          APP_TENANT_BRAND: IronWrap
          APP_LOCALE: en-CA
          APP_TIME_ZONE: America/Edmonton
          APP_CURRENCY: CAD
          FROM_EMAIL: sales@ironwrapexteriors.com
          APP_BFF_ENABLED: "false"
          APP_CUSTOMER_PORTAL_ENABLED: "false"
        run: node tools/validate-tenant-runtime.mjs
      - name: Prove deterministic AppliCad extraction
        run: node tools/applicad-xml-proof.mjs --check

      - name: Install pinned Python validation tools
        run: python -m pip install --disable-pip-version-check ruff==0.13.0 build==1.4.0 ./frappe-apps/ironwrap_roofing
      - name: Install erpnext-roofing-mcp dependencies
        run: npm ci --prefix mcp/erpnext-roofing-mcp
      - name: Test leftover Frappe application contracts without a site
        continue-on-error: true
        working-directory: frappe-apps/ironwrap_roofing
        run: python -m unittest discover -s tests -t .
      - name: Lint and compile leftover Frappe application
        continue-on-error: true
        working-directory: frappe-apps/ironwrap_roofing
        run: |
          ruff check ironwrap_roofing tests
          python -m compileall -q ironwrap_roofing tests
      - name: Build leftover Frappe wheel
        continue-on-error: true
        working-directory: frappe-apps/ironwrap_roofing
        run: python -m build --wheel

      - name: Test erpnext-roofing-mcp
        run: npm test --prefix mcp/erpnext-roofing-mcp
      - name: Test ironwrap-bus-mcp
        run: npm ci --prefix mcp/ironwrap-bus-mcp && npm test --prefix mcp/ironwrap-bus-mcp
      - name: Test role-filtered newo-mcp
        run: npm ci --prefix mcp/newo-mcp && npm test --prefix mcp/newo-mcp

      - name: Install PWA dependencies
        run: npm ci --prefix app
      - name: Validate and build PWA assets
        # The default `run:` shell is `bash -e {0}`, which does not set pipefail:
        # piping the suite through tee would make this step report the exit
        # status of tee, so a failing test could not fail the step. `shell: bash`
        # runs `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        run: |
          npm run typecheck --prefix app
          npm run lint --prefix app
          npm test --prefix app 2>&1 | tee "$RUNNER_TEMP/ironwrap-app-tests.log"
          npm run format:check --prefix app
          npm run build --prefix app
      - name: Install Playwright Chromium for app e2e
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run app Playwright e2e (PWA suite)
        run: npm run test:pwa --prefix app
      # The board is an office surface, so it needs an office session the default
      # field-mode acceptance server does not serve. Mobile evidence for it is a gate,
      # not a nice-to-have, so the suite runs here rather than only on a laptop.
      - name: Run app Playwright e2e (pipeline board, office session)
        run: npm run test:pwa:board --prefix app
      # Owner configuration is an office surface too, and its spec self-skips unless it
      # is handed an office session. `test:pwa` never sets one, so without this step the
      # whole file reported "3 skipped" and the route/state/role/device matrix it proves
      # was never actually run in CI.
      - name: Run app Playwright e2e (owner configuration, office session)
        run: npm run test:pwa:owner-configuration --prefix app
      - name: Install Worker dependencies
        run: npm ci --ignore-scripts --prefix workers-bus
      - name: Generate Worker binding types
        run: npm run typegen --prefix workers-bus
      - name: Apply every Worker migration to an isolated local D1 state
        run: npm run db:migrate:local --prefix workers-bus -- --persist-to "$RUNNER_TEMP/ironwrap-d1"
      - name: Test Worker bus
        # Same reason as the PWA step: keep the TAP capture, but let a failing
        # worker test fail here instead of surfacing later as a missing-evidence
        # error from validate-documentation.
        shell: bash
        run: npm test --prefix workers-bus 2>&1 | tee "$RUNNER_TEMP/ironwrap-worker-tests.tap"
      - name: Typecheck Worker bus
        run: npm run typecheck --prefix workers-bus
      - name: Bundle Worker without deploying
        run: npm run deploy --prefix workers-bus -- --dry-run
      - name: Audit privileged PWA and Worker toolchains
        run: |
          npm audit --prefix app
          npm audit --prefix workers-bus
      - name: Audit shipped Node dependencies
        run: |
          npm audit --omit=dev --prefix app
          npm audit --omit=dev --prefix workers-bus
          npm audit --omit=dev --prefix mcp/erpnext-roofing-mcp
          npm audit --omit=dev --prefix mcp/ironwrap-bus-mcp
          npm audit --omit=dev --prefix mcp/newo-mcp

      - name: Test production-readiness verifier
        run: node --test tools/production-readiness.test.mjs
      - name: Test launch-proof release evidence runner
        run: node --test tools/launch-proof.test.mjs
      - name: Test production deploy cutover contract
        run: node --test tools/deploy-workflow.test.mjs
      - name: Test signed release permit contract
        run: node --test tools/release-permit.test.mjs tools/release-promotion.test.mjs
      - name: Validate repository production contract
        run: node tools/production-readiness.mjs contract
      - name: Validate shell syntax
        run: find deploy workers-bus -path '*/node_modules' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: No em dashes in Hermes and agent-facing configuration
        run: |
          if grep -rl $'—' hermes/ config/ deploy/; then
            echo "em dash found in agent-facing content" >&2; exit 1
          fi

      - name: Emit exact-source and tested-checkout capability evidence receipt
        env:
          CAPABILITY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CAPABILITY_BASE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          node tools/validate-documentation.mjs \
            --app-test-output "$RUNNER_TEMP/ironwrap-app-tests.log" \
            --worker-test-output "$RUNNER_TEMP/ironwrap-worker-tests.tap" \
            --evidence "$RUNNER_TEMP/ironwrap-capability-evidence.json"

  # Secret scanning runs on its own runner, before and independently of any dependency
  # install, so the only bytes on the machine are the tracked tree. The scanner binary is
  # pinned by version and verified by SHA-256 rather than run through a marketplace action:
  # gitleaks-action requires an organisation licence key, and an unpinned installer is a
  # supply-chain hole in the one job whose purpose is supply-chain hygiene.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install pinned gitleaks
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # The scanner's fail-closed contract is tested here rather than in build-and-test
      # because two of its cases need the real pinned binary, which only this runner has.
      # The suite adds no dependency: node's own test runner, on the tracked tree.
      - name: Test the fail-closed contract of the secret scanner
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: node --test tools/secret-scan.test.mjs
      - name: Scan the tracked tree for committed secrets
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: node tools/secret-scan.mjs

  # The paired-device budget is a timing measurement, so it gets a runner of its own.
  # Sharing one with the validator, unit, Playwright and Python suites left ~10 minutes
  # of prior work on the machine before Lighthouse started and pushed the job into its
  # own 20-minute timeout on slower runners. Thresholds, run count and the emulated
  # device/CPU/network profile are unchanged — only the isolation.
  paired-device-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Depth 2 so HEAD^ resolves. For a pull request that is the base branch tip
      # `actions/checkout` merged into, and for a push it is the previous commit on the
      # branch, which is the comparison the scope decision below wants in both cases.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Nine of the nine budget failures in the 58 jobs surveyed for ELEC-106 were on
      # commits that changed nothing under `app/`: the bundle was byte-identical to one the
      # parent commit had already measured green, so the red was runner noise and nothing
      # else. Deciding scope before measuring is what stops the gate re-rolling that dice.
      # The rationale, and why this does not weaken the budget, is in
      # app/scripts/lighthouse-scope.mjs.
      - name: Decide whether the PWA bundle can have changed
        id: scope
        run: node app/scripts/lighthouse-scope.mjs
      - name: Install app dependencies
        if: steps.scope.outputs.measure == 'true'
        run: npm ci --prefix app
      - name: Install Playwright Chromium
        if: steps.scope.outputs.measure == 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run paired-device Lighthouse thresholds
        if: steps.scope.outputs.measure == 'true'
        run: npm run test:lighthouse --prefix app
      # The gate reports only the assertions it failed, so a run that fails on one
      # metric hides how much headroom the others had — and a run that passes reports
      # nothing at all. The readings are already on disk; print them either way.
      - name: Report paired-device Lighthouse readings
        if: always()
        shell: bash
        env:
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "scope: ${SCOPE_REASON:-the scope step did not run}"
          summary=app/.lighthouseci/lighthouse-summary.json
          if [ ! -f "$summary" ]; then
            echo "no Lighthouse summary was produced"
            exit 0
          fi
          node -e '
            const summary = require("./" + process.argv[1]);
            const round = (value) => Math.round(value * 1000) / 1000;
            console.log(`url ${summary.url} over ${summary.runs} runs`);
            for (const [audit, reading] of Object.entries(summary.aggregate)) {
              console.log(
                `${audit.padEnd(28)} median ${String(round(reading.median)).padEnd(10)}` +
                  ` runs ${reading.values.map(round).join(", ")}`,
              );
            }
            // The runner is part of the reading. Printing its speed next to the numbers is
            // what lets a later comparison of two jobs on the same bytes say which machine
            // each ran on, instead of reconstructing it from the metrics themselves.
            const runner = summary.runner;
            if (runner) {
              console.log(
                `${"benchmarkIndex".padEnd(28)} median ${String(round(runner.benchmarkIndex.median)).padEnd(10)}` +
                  ` runs ${runner.benchmarkIndex.values.map(round).join(", ")}`,
              );
            }
          ' "$summary"

  # Splitting the work into two jobs must not quietly stop the mobile-first budget from
  # blocking a merge: `validate-and-test` is the branch ruleset's required check and the
  # name the release-admission gate reads back. It keeps that name and now passes only
  # when both real jobs did.
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-and-test, paired-device-lighthouse, secret-scan]
    if: always()
    steps:
      - name: Require every CI job to have succeeded
        env:
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          PAIRED_DEVICE_LIGHTHOUSE: ${{ needs.paired-device-lighthouse.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          echo "build-and-test: $BUILD_AND_TEST"
          echo "paired-device-lighthouse: $PAIRED_DEVICE_LIGHTHOUSE"
          echo "secret-scan: $SECRET_SCAN"
          if [ "$BUILD_AND_TEST" != "success" ] || [ "$PAIRED_DEVICE_LIGHTHOUSE" != "success" ] || [ "$SECRET_SCAN" != "success" ]; then
            echo "a required CI job did not succeed" >&2
            exit 1
          fi
