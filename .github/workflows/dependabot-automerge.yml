# Read-only dependency metadata for an authorized root's serial review.
# Never merge, approve or arm auto-merge with GITHUB_TOKEN. The authorized
# user-token merge path must produce its own push CI and QA qualification.
# These advisory notices grant no source approval or release authority.
#
# Only GitHub-owned actions are allowed, so read Dependabot's commit metadata
# with the preinstalled gh CLI instead of dependabot/fetch-metadata.
name: Dependabot review classification

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  classify:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Classify dependency metadata for serial review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if ! messages="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq '.[].commit.message')"; then
            echo "::warning::dependency_classification=metadata_unavailable; commit metadata read failed"
            exit 1
          fi
          types="$(printf '%s\n' "$messages" | sed -n 's/^[[:space:]]*update-type:[[:space:]]*//p' | sort -u)"
          counts="$(printf '%s\n' "$messages" | awk '
            /^[[:space:]]*-[[:space:]]*dependency-name:/ { dependencies++ }
            /^[[:space:]]*update-type:/ { types++ }
            END { printf "%d %d", dependencies, types }')"
          read -r dependencies declared_types <<< "$counts"
          if [[ -z "$types" || "$dependencies" -eq 0 || "$dependencies" -ne "$declared_types" ]]; then
            echo "::notice::dependency_classification=metadata_missing; dependency update types are incomplete"
            exit 0
          fi
          if grep -qvE '^version-update:semver-(patch|minor)$' <<<"$types"; then
            echo "::notice::dependency_classification=review_required; metadata is not only patch and minor updates"
            exit 0
          fi
          if ! required="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/rules/branches/${BASE}" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')"; then
            echo "::warning::dependency_classification=checks_unavailable; branch rules read failed"
            exit 1
          fi
          if [[ ! "$required" =~ ^[0-9]+$ ]]; then
            echo "::warning::dependency_classification=checks_unavailable; branch rules result is invalid"
            exit 1
          fi
          if [[ "$required" -eq 0 ]]; then
            echo "::warning::dependency_classification=checks_missing; no required status check is configured"
            exit 0
          fi
          echo "::notice::dependency_classification=eligible_for_serial_review; patch/minor metadata and required checks are configured; authorized root merge and exact push CI/QA remain separate"
