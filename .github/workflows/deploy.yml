name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# The release never merges: it runs only after a PR has already landed on main,
# so no job needs a token that can write contents or pull requests.
permissions:
  contents: read
  actions: read

env:
  WORKER_VERSION: 4.131.0
  RELEASE_REPOSITORY: ${{ github.repository }}
  RELEASE_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
  RELEASE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
  RELEASE_RULESET_ID: 20652124
  CLOUDFLARE_ACCOUNT_ID: 7ee5775bc1ba46f05c5a65235b60e939
  RELEASE_QA_BASE_URL: https://ironwrap-bus-qa.yellow-rain-7498.workers.dev
  # A push to main deploys and proves qa only; production is a separate
  # tag-triggered release (IRO-264). The first Deploy run after this merge
  # fails closed at admission by design: the enforcer is the pre-merge tree,
  # which still rejects --environment qa (IRO-260).
  RELEASE_FRAPPE_SCOPE: out-of-scope

jobs:
  admission:
    name: Exact merged source and predecessor-policy context
    # Only the successful push-sourced CI run that validated main reaches
    # admission. A pull_request-sourced CI success (an agent's open PR, a
    # Dependabot PR) never releases or merges anything: merging stays the
    # decision of whoever merges the PR, and the release follows that merge.
    # head_repository pins the run to this repository, so a fork's CI -
    # including a fork whose default branch is also named main - never
    # produces an admissible workflow_run here.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Check out generation N policy enforcement from the PR base
        run: |
          set -euo pipefail
          # workflow_run.pull_requests is empty for a push event. Generation N
          # is the squash commit's single parent: main immediately before this
          # release landed. Anything with a different parent count is not a
          # squash of an admitted PR.
          lineage="$(git rev-list --parents --max-count=1 "$RELEASE_SOURCE_COMMIT")"
          if [[ "$(wc -w <<< "$lineage")" -ne 2 ]]; then echo "release_admission_push_not_linear" >&2; exit 1; fi
          base_commit="${lineage##* }"
          if [[ ! "$base_commit" =~ ^[0-9a-f]{40}$ ]]; then echo "release_admission_base_missing" >&2; exit 1; fi
          git worktree add --detach "$RUNNER_TEMP/policy-enforcer" "$base_commit"
          printf 'RELEASE_ENFORCER=%s\n' "$RUNNER_TEMP/policy-enforcer/tools/release-promotion.mjs" >> "$GITHUB_ENV"
          printf 'RELEASE_BASE_COMMIT=%s\n' "$base_commit" >> "$GITHUB_ENV"

      - name: Read exact merged source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$RELEASE_ENFORCER" push-context \
            --repository "$RELEASE_REPOSITORY" --run-id "$RELEASE_CI_RUN_ID" \
            --ruleset-id "$RELEASE_RULESET_ID" \
            --head-commit "$RELEASE_SOURCE_COMMIT" --base-commit "$RELEASE_BASE_COMMIT" \
            --output "$RUNNER_TEMP/pr-context.json"

      - name: Capture exact source, tree, and binary diff evidence
        run: |
          set -euo pipefail
          base_commit="$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/pr-context.json" --field base_commit)"
          printf 'BASE_COMMIT=%s\n' "$base_commit" >> "$GITHUB_ENV"
          node "$RELEASE_ENFORCER" source-evidence \
            --repo-root "$GITHUB_WORKSPACE" --source-commit "$RELEASE_SOURCE_COMMIT" \
            --base-commit "$base_commit" --output "$RUNNER_TEMP/source-evidence.json"

      - name: Collect exact successful CI check IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$RELEASE_ENFORCER" ci-checks \
            --repository "$RELEASE_REPOSITORY" \
            --run-id "$RELEASE_CI_RUN_ID" \
            --job-names "paired-device-lighthouse,gate,validate-and-test" \
            --output "$RUNNER_TEMP/ci-checks.json"

      - name: Compute environment config and migration contracts
        run: |
          set -euo pipefail
          node "$RELEASE_ENFORCER" config-digest \
            --repo-root "$GITHUB_WORKSPACE" --environment qa \
            --output "$RUNNER_TEMP/qa-config.json"
          node "$RELEASE_ENFORCER" admission-context \
            --repo-root "$GITHUB_WORKSPACE" --repository "$RELEASE_REPOSITORY" \
            --environment qa \
            --source "$RUNNER_TEMP/source-evidence.json" --checks "$RUNNER_TEMP/ci-checks.json" \
            --pr-context "$RUNNER_TEMP/pr-context.json" \
            --qa "$RUNNER_TEMP/qa-config.json" --output "$RUNNER_TEMP/context.json"

      - name: Publish admission context (no secrets)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iro41-admission-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/pr-context.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build one immutable artifact
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iro41-admission-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/admission
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            workers-bus/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Load generation N policy enforcement
        run: |
          set -euo pipefail
          base_commit="$(jq -er '.base_commit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/admission/context.json")"
          git worktree add --detach "$RUNNER_TEMP/policy-enforcer" "$base_commit"
          printf 'RELEASE_ENFORCER=%s\n' "$RUNNER_TEMP/policy-enforcer/tools/release-promotion.mjs" >> "$GITHUB_ENV"

      - name: Install pinned application and Worker toolchains
        run: |
          set -euo pipefail
          npm ci --prefix app
          npm ci --ignore-scripts --prefix workers-bus
          python -m pip install --disable-pip-version-check build==1.4.0
          test "$(workers-bus/node_modules/.bin/wrangler --version)" = "$WORKER_VERSION"

      - name: Build PWA and one Worker bundle
        run: |
          set -euo pipefail
          npm run build --prefix app
          python -m build --wheel --outdir "$RUNNER_TEMP/frappe-dist" frappe-apps/ironwrap_roofing
          npm run typegen --prefix workers-bus
          bundle_dir="$RUNNER_TEMP/worker-bundle"
          mkdir -p "$bundle_dir"
          workers-bus/node_modules/.bin/wrangler deploy \
            --config workers-bus/wrangler.jsonc --env qa --dry-run --strict \
            --outdir "$bundle_dir"
          test -s "$bundle_dir/index.js"

      - name: Create deterministic artifact archive
        id: archive
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/release-artifact"
          mkdir -p "$artifact_root/worker" "$artifact_root/app" "$artifact_root/frappe"
          cp "$RUNNER_TEMP/worker-bundle/index.js" "$artifact_root/worker/index.js"
          if [[ -f "$RUNNER_TEMP/worker-bundle/index.js.map" ]]; then cp "$RUNNER_TEMP/worker-bundle/index.js.map" "$artifact_root/worker/index.js.map"; fi
          cp -R app/dist "$artifact_root/app/dist"
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/frappe-dist/*.whl)
          test "${#wheels[@]}" -eq 1
          frappe_wheel="${wheels[0]}"
          test -s "$frappe_wheel"
          cp "$frappe_wheel" "$artifact_root/frappe/ironwrap_roofing.whl"
          node "$RELEASE_ENFORCER" artifact-manifest \
            --worker "$artifact_root/worker/index.js" --pwa "$artifact_root/app/dist" \
            --frappe-wheel "$artifact_root/frappe/ironwrap_roofing.whl" \
            --output "$RUNNER_TEMP/artifact-components.json"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$artifact_root" -cf "$RUNNER_TEMP/ironwrap-release-artifact.tar" .
          artifact_digest="$(sha256sum "$RUNNER_TEMP/ironwrap-release-artifact.tar" | awk '{print $1}')"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Upload the artifact exactly once
        id: upload_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iro41-release-artifact-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/ironwrap-release-artifact.tar
          if-no-files-found: error
          retention-days: 1

      - name: Bind artifact and upload receipt into context
        env:
          ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.upload_artifact.outputs.artifact-id }}
          ARTIFACT_UPLOAD_DIGEST: ${{ steps.upload_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          node "$RELEASE_ENFORCER" bind-artifact \
            --context "$RUNNER_TEMP/admission/context.json" --artifact-digest "$ARTIFACT_DIGEST" \
            --artifact-id "$ARTIFACT_ID" --uploaded-digest "$ARTIFACT_UPLOAD_DIGEST" \
            --component-manifest "$RUNNER_TEMP/artifact-components.json"

      - name: Publish context bound to the single artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iro41-built-context-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/admission/context.json
            ${{ runner.temp }}/admission/pr-context.json
            ${{ runner.temp }}/artifact-components.json
          if-no-files-found: error
          retention-days: 1

  qa:
    name: Isolated qa, smoke, restore, and rollback drill
    needs: build
    environment: qa
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iro41-release-artifact-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/artifact-download
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iro41-built-context-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/context-download
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Load generation N policy enforcement and trusted Wrangler
        run: |
          set -euo pipefail
          base_commit="$(jq -er '.base_commit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/context-download/context.json")"
          git worktree add --detach "$RUNNER_TEMP/policy-enforcer" "$base_commit"
          printf 'RELEASE_ENFORCER=%s\n' "$RUNNER_TEMP/policy-enforcer/tools/release-promotion.mjs" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/policy-enforcer/workers-bus"
          trusted_wrangler="$RUNNER_TEMP/policy-enforcer/workers-bus/node_modules/.bin/wrangler"
          test "$("$trusted_wrangler" --version)" = "$WORKER_VERSION"
          printf 'WRANGLER_BIN=%s\n' "$trusted_wrangler" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/policy-enforcer/tools/release-promotion.mjs" provider-targets \
            --candidate-root "$GITHUB_WORKSPACE" --policy-root "$RUNNER_TEMP/policy-enforcer" \
            --environment qa --output "$RUNNER_TEMP/qa-provider-targets.json"

      - name: Require isolated smoke inputs before any qa mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
          RELEASE_QA_INGEST_TOKEN: ${{ secrets.RELEASE_QA_INGEST_TOKEN }}
          RELEASE_QA_ADMIN_TOKEN: ${{ secrets.RELEASE_QA_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN RELEASE_QA_INGEST_TOKEN RELEASE_QA_ADMIN_TOKEN; do
            if [[ -z "${!required:-}" ]]; then echo "release_qa_missing_external_secret:$required" >&2; exit 1; fi
          done

      - name: Verify the same immutable artifact bytes
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/artifact-download/ironwrap-release-artifact.tar" -C "$RUNNER_TEMP"
          test "$(sha256sum "$RUNNER_TEMP/ironwrap-release-artifact.tar" | awk '{print $1}')" = "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field artifact_digest)"

      - name: Verify isolated qa secret-name inventory before mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          "$WRANGLER_BIN" secret list \
            --config workers-bus/wrangler.jsonc --env qa --format json > "$RUNNER_TEMP/qa-secret-list.json"
          node "$RELEASE_ENFORCER" secret-readback \
            --input "$RUNNER_TEMP/qa-secret-list.json" --output "$RUNNER_TEMP/qa-secret-inventory.json" \
            --context "$RUNNER_TEMP/context-download/context.json" --environment qa

      - name: Fail closed on static qa readiness drift before mutation
        run: |
          set -euo pipefail
          node "$RELEASE_ENFORCER" environment-preflight \
            --repo-root "$GITHUB_WORKSPACE" --environment qa \
            --secret-inventory "$RUNNER_TEMP/qa-secret-inventory.json" \
            --output "$RUNNER_TEMP/qa-environment-preflight.json"

      - name: Apply expand/contract migrations to isolated qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: '"$WRANGLER_BIN" d1 migrations apply DB --config workers-bus/wrangler.jsonc --remote --env qa'

      - name: Capture the current isolated qa revision
        id: capture_qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          "$WRANGLER_BIN" deployments list \
            --config workers-bus/wrangler.jsonc --env qa --json > "$RUNNER_TEMP/qa-before.json"
          previous="$(node "$RELEASE_ENFORCER" deployment-revision \
            --input "$RUNNER_TEMP/qa-before.json" --output "$RUNNER_TEMP/qa-previous.id" >/dev/null && cat "$RUNNER_TEMP/qa-previous.id")"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Upload the same immutable bundle to isolated qa
        id: upload_qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          message="$(node "$RELEASE_ENFORCER" version-message \
            --context "$RUNNER_TEMP/context-download/context.json" --environment qa)"
          "$WRANGLER_BIN" versions upload \
            "$RUNNER_TEMP/worker/index.js" --config workers-bus/wrangler.jsonc --env qa \
            --no-bundle --assets "$RUNNER_TEMP/app/dist" --strict --message "$message" \
            > "$RUNNER_TEMP/qa-upload.log" 2>&1
          node "$RELEASE_ENFORCER" parse-version \
            --input "$RUNNER_TEMP/qa-upload.log" --output "$RUNNER_TEMP/qa-version.id"
          echo "revision=$(cat "$RUNNER_TEMP/qa-version.id")" >> "$GITHUB_OUTPUT"

      - name: Verify isolated qa provider version readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          revision="$(cat "$RUNNER_TEMP/qa-version.id")"
          "$WRANGLER_BIN" versions view "$revision" \
            --config workers-bus/wrangler.jsonc --env qa --json > "$RUNNER_TEMP/qa-version.json"
          node "$RELEASE_ENFORCER" version-readback \
            --input "$RUNNER_TEMP/qa-version.json" --output "$RUNNER_TEMP/qa.json" \
            --environment qa --version-id "$revision" \
            --source-commit "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field source_commit)" \
            --source-tree "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field source_tree_sha256)" \
            --artifact-digest "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field artifact_digest)" \
            --config-digest "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field qa_config_digest)" \
            --context "$RUNNER_TEMP/context-download/context.json" \
            --secret-inventory "$RUNNER_TEMP/qa-secret-inventory.json"

      - name: Deploy candidate to isolated qa traffic
        id: deploy_qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: '"$WRANGLER_BIN" versions deploy --config workers-bus/wrangler.jsonc --env qa --version-id "$(cat "$RUNNER_TEMP/qa-version.id")" --yes'

      - name: Verify qa active revision, health, and owned-core readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/qa-version.id")"
          "$WRANGLER_BIN" deployments list --config workers-bus/wrangler.jsonc --env qa --json > "$RUNNER_TEMP/qa-active.json"
          node "$RELEASE_ENFORCER" deployment-revision \
            --input "$RUNNER_TEMP/qa-active.json" --expected "$expected" --output "$RUNNER_TEMP/qa-active.id"
          for attempt in $(seq 1 12); do
            health_code="$(curl --silent --show-error --output "$RUNNER_TEMP/qa-health.json" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$RELEASE_QA_BASE_URL/health" || true)"
            ready_code="$(curl --silent --show-error --output "$RUNNER_TEMP/qa-ready.json" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$RELEASE_QA_BASE_URL/ready?scope=core" || true)"
            if [[ "$health_code" == 200 && "$ready_code" == 200 ]] && node "$RELEASE_ENFORCER" readiness \
              --health "$RUNNER_TEMP/qa-health.json" --ready "$RUNNER_TEMP/qa-ready.json"
            then break; fi
            if [[ "$attempt" == 12 ]]; then echo "release_qa_readiness_failed" >&2; exit 1; fi
            sleep 5
          done

      - name: Deploy the qa Worker triggers after traffic cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: '"$WRANGLER_BIN" triggers deploy --config workers-bus/wrangler.jsonc --env qa'

      - name: Read back the qa Worker cron schedules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --connect-timeout 10 --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ironwrap-bus-qa/schedules" \
            --output "$RUNNER_TEMP/qa-cron-schedules.json"
          node "$RELEASE_ENFORCER" cron-readback \
            --repo-root "$GITHUB_WORKSPACE" --environment qa \
            --input "$RUNNER_TEMP/qa-cron-schedules.json" \
            --output "$RUNNER_TEMP/qa-cron-readback.json"

      - name: Run authenticated affected-workflow smoke receipt
        env:
          BUS_BASE_URL: ${{ env.RELEASE_QA_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.RELEASE_QA_INGEST_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.RELEASE_QA_ADMIN_TOKEN }}
        run: node "$(dirname "$RELEASE_ENFORCER")/launch-proof.mjs" --execute > "$RUNNER_TEMP/qa-smoke-evidence.json"

      - name: Re-read and bind the post-smoke staged revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          "$WRANGLER_BIN" deployments list \
            --config workers-bus/wrangler.jsonc --env qa --json > "$RUNNER_TEMP/qa-post-smoke.json"
          node "$RELEASE_ENFORCER" deployment-revision \
            --input "$RUNNER_TEMP/qa-post-smoke.json" --expected "$(cat "$RUNNER_TEMP/qa-version.id")" \
            --output "$RUNNER_TEMP/qa-post-smoke.id"
          node "$RELEASE_ENFORCER" smoke-receipt \
            --evidence "$RUNNER_TEMP/qa-smoke-evidence.json" \
            --output "$RUNNER_TEMP/qa-smoke.json" \
            --source-commit "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field source_commit)" \
            --revision "$(cat "$RUNNER_TEMP/qa-post-smoke.id")"

      - name: Export and restore qa data into a separate local drill target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export_log="$RUNNER_TEMP/qa-export.log"
          if ! "$WRANGLER_BIN" d1 export ironwrap-bus-qa \
            --config workers-bus/wrangler.jsonc --env qa --remote --output "$RUNNER_TEMP/qa.sql" \
            > "$export_log" 2>&1
          then
            echo "release_qa_export_failed" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/qa.sql"
          source_database="$RUNNER_TEMP/qa-restore-source-${GITHUB_RUN_ID}.sqlite"
          restored_database="$RUNNER_TEMP/qa-restore-restored-${GITHUB_RUN_ID}.sqlite"
          test ! -e "$source_database"
          test ! -e "$restored_database"
          node "$RELEASE_ENFORCER" restore-local \
            --export "$RUNNER_TEMP/qa.sql" --database "$source_database" \
            --output "$RUNNER_TEMP/qa-source-manifest.json"
          node "$RELEASE_ENFORCER" restore-local \
            --export "$RUNNER_TEMP/qa.sql" --database "$restored_database" \
            --output "$RUNNER_TEMP/qa-restored-manifest.json"
          node "$RELEASE_ENFORCER" restore-readback \
            --export "$RUNNER_TEMP/qa.sql" \
            --source "$RUNNER_TEMP/qa-source-manifest.json" \
            --restored "$RUNNER_TEMP/qa-restored-manifest.json" \
            --source-target "$source_database" \
            --restored-target "$restored_database" \
            --output "$RUNNER_TEMP/qa-restore.readback"
          # There is no policy generation ledger in the qa-only push path (IRO-260);
          # 0 is a fixed placeholder, never read back by anything.
          node "$RELEASE_ENFORCER" backup-receipt \
            --export "$RUNNER_TEMP/qa.sql" --readback "$RUNNER_TEMP/qa-restore.readback" \
            --output "$RUNNER_TEMP/backup-restore.json" --source-commit "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field source_commit)" \
            --source-generation 0 \
            --artifact-digest "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field artifact_digest)" \
            --target "ironwrap-qa-local-restore-${GITHUB_RUN_ID}"

      - name: Roll back qa candidate and prove the previous revision against migrated data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
          BUS_BASE_URL: ${{ env.RELEASE_QA_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.RELEASE_QA_INGEST_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.RELEASE_QA_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          previous="${{ steps.capture_qa.outputs.previous }}"
          "$WRANGLER_BIN" versions deploy --config workers-bus/wrangler.jsonc --env qa --version-id "$previous" --yes
          "$WRANGLER_BIN" deployments list --config workers-bus/wrangler.jsonc --env qa --json > "$RUNNER_TEMP/qa-rollback.json"
          node "$RELEASE_ENFORCER" deployment-rollback-readback \
            --input "$RUNNER_TEMP/qa-rollback.json" --expected "$previous" --output "$RUNNER_TEMP/qa-rollback.readback"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 20 "$BUS_BASE_URL/health" > "$RUNNER_TEMP/qa-rollback-health.json"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 20 "$BUS_BASE_URL/ready?scope=core" > "$RUNNER_TEMP/qa-rollback-ready.json"
          node "$RELEASE_ENFORCER" readiness \
            --health "$RUNNER_TEMP/qa-rollback-health.json" --ready "$RUNNER_TEMP/qa-rollback-ready.json"
          node "$(dirname "$RELEASE_ENFORCER")/launch-proof.mjs" --execute > "$RUNNER_TEMP/qa-rollback-smoke-evidence.json"
          "$WRANGLER_BIN" versions deploy --config workers-bus/wrangler.jsonc --env qa --version-id "$(cat "$RUNNER_TEMP/qa-version.id")" --yes
          "$WRANGLER_BIN" deployments list --config workers-bus/wrangler.jsonc --env qa --json > "$RUNNER_TEMP/qa-repromoted.json"
          node "$RELEASE_ENFORCER" deployment-revision \
            --input "$RUNNER_TEMP/qa-repromoted.json" --expected "$(cat "$RUNNER_TEMP/qa-version.id")" \
            --output "$RUNNER_TEMP/qa-repromoted.readback"
          node "$RELEASE_ENFORCER" rollback-receipt \
            --readback "$RUNNER_TEMP/qa-rollback.readback" --re-promoted "$RUNNER_TEMP/qa-repromoted.readback" \
            --health "$RUNNER_TEMP/qa-rollback-health.json" --ready "$RUNNER_TEMP/qa-rollback-ready.json" \
            --smoke "$RUNNER_TEMP/qa-rollback-smoke-evidence.json" --output "$RUNNER_TEMP/rollback.json" \
            --source-commit "$(node "$RELEASE_ENFORCER" context-field --context "$RUNNER_TEMP/context-download/context.json" --field source_commit)" \
            --candidate "$(cat "$RUNNER_TEMP/qa-version.id")" --previous "$previous"

      - name: Publish redacted qa proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iro41-qa-proof-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/context-download/context.json
            ${{ runner.temp }}/qa-provider-targets.json
            ${{ runner.temp }}/qa.json
            ${{ runner.temp }}/qa-environment-preflight.json
            ${{ runner.temp }}/qa-cron-readback.json
            ${{ runner.temp }}/qa-smoke-evidence.json
            ${{ runner.temp }}/qa-smoke.json
            ${{ runner.temp }}/backup-restore.json
            ${{ runner.temp }}/qa-rollback-smoke-evidence.json
            ${{ runner.temp }}/rollback.json
          if-no-files-found: error
          retention-days: 30

      - name: Restore previous isolated qa revision after any post-deploy failure
        id: cleanup_qa
        if: ${{ failure() && steps.deploy_qa.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_QA_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          previous="${{ steps.capture_qa.outputs.previous }}"
          candidate="$(cat "$RUNNER_TEMP/qa-version.id")"
          command_result="succeeded"
          if ! "$WRANGLER_BIN" versions deploy \
            --config workers-bus/wrangler.jsonc --env qa --version-id "$previous" --yes
          then
            command_result="nonzero_reconciled"
          fi
          "$WRANGLER_BIN" deployments list \
            --config workers-bus/wrangler.jsonc --env qa --json > "$RUNNER_TEMP/qa-failure-cleanup.json"
          node "$RELEASE_ENFORCER" qa-cleanup-receipt \
            --input "$RUNNER_TEMP/qa-failure-cleanup.json" \
            --previous "$previous" --candidate "$candidate" \
            --command-result "$command_result" \
            --output "$RUNNER_TEMP/qa-failure-cleanup-receipt.json"

      - name: Publish isolated qa failure cleanup receipt
        if: ${{ always() && steps.cleanup_qa.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iro41-qa-cleanup-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-failure-cleanup-receipt.json
          if-no-files-found: error
          retention-days: 30

