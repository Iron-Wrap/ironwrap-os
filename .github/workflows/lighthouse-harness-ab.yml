# Measures the same build over both acceptance-server protocols and prints the readings side
# by side. It exists because the paired-device budget's fidelity is a claim about the harness,
# and a claim that cannot be re-measured is an assertion.
#
# This is evidence, never a gate. It is intentionally absent from `validate-and-test` and from
# the deploy workflow's `--job-names`: a merge must not depend on it, and a leg that misses a
# bar is the datapoint it went looking for rather than a failure. The budget that does block a
# merge stays `paired-device-lighthouse` in ci.yml, with its thresholds untouched.
name: Lighthouse harness A/B

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Mirrored A/B rounds; each round is one leg per protocol, 5 runs per leg
        required: false
        default: "2"
  # Only when the harness itself moves. Every other pull request would pay ~10 minutes of
  # runner time for a measurement about code it did not touch.
  pull_request:
    paths:
      - app/lighthouserc.cjs
      - app/scripts/acceptance-certificate.mjs
      - app/scripts/acceptance-server.mjs
      - app/scripts/chrome-for-testing.json
      - app/scripts/lighthouse-chrome.mjs
      - app/scripts/lighthouse-field.mjs
      - app/scripts/lighthouse-protocol-ab.mjs
      - app/scripts/lighthouse-statistics.mjs
      - .github/workflows/lighthouse-harness-ab.yml

permissions:
  contents: read

concurrency:
  group: lighthouse-ab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-ab:
    runs-on: ubuntu-latest
    # Four legs of five Lighthouse runs, plus install and build. The paired-device budget's own
    # job needs 20; this one measures twice as much on the same class of runner.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: npm ci --prefix app
      # Both arms are read on the budget's own pinned Chrome for Testing build, never on
      # Playwright's Chromium (app/scripts/lighthouse-chrome.mjs).
      - name: Install the pinned Chrome for Testing
        timeout-minutes: 5
        run: node app/scripts/lighthouse-chrome.mjs
      - name: Measure the same build over HTTP/2 and HTTP/1.1
        working-directory: app
        env:
          LIGHTHOUSE_AB_ROUNDS: ${{ inputs.rounds || '2' }}
        run: npm run test:lighthouse:ab
      - name: Upload A/B readings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-protocol-ab-${{ github.sha }}
          path: app/.lighthouseci/
          # `.lighthouseci` is a dot directory, and the action skips hidden files by default:
          # without this it matched nothing, warned, and the job still went green having
          # uploaded no evidence at all.
          include-hidden-files: true
          # An A/B that produced no readings is a result worth keeping, so a missing file is
          # an error rather than a shrug.
          if-no-files-found: error
          retention-days: 14
