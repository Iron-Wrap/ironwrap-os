name: Release Please

# The release train (IRO-264), in two independent jobs that share no state:
#
#   release-pr     on every push to main (or by hand): keep exactly one release
#                  pull request open, with the next version and the accumulated
#                  changelog. First it warns, without failing anything, when the
#                  commit that landed is not a conventional commit release-please
#                  can parse: such a commit is silently dropped from the release.
#   github-release on a successful Deploy of the merged release commit: tag that
#                  commit, which is what starts the production release.
#
# Nothing here runs on a pull request event. The subject check used to, on every
# push to every pull request, and Release Please was about a fifth of all Actions
# runs. It now warns after the merge instead of before it, and it never holds up
# a pull request. `workflow_dispatch` re-runs release-pr by hand; the `release`
# environment admits runs from main only.
#
# Both release jobs write through RELEASE_TAG_TOKEN, a fine-grained PAT held only in the
# `release` environment (deployments from main only). A pull request or tag created with
# GITHUB_TOKEN starts no workflow without approval, so the release PR would never run CI
# and the tag would never start deploy-production.yml. Their GITHUB_TOKEN only reads.
#
# release-please is run through npx, not an action: the organization allows only
# GitHub-owned actions, and `googleapis/release-please-action` is not one.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

# Nothing is granted by default; each job declares exactly what it needs.
permissions: {}

env:
  RELEASE_PLEASE_VERSION: 17.11.2

jobs:
  release-pr:
    name: Keep one release pull request open
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # release-please pushes the release branch and opens/updates the release PR with
    # RELEASE_TAG_TOKEN; GITHUB_TOKEN only checks out.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The subject that landed is what release-please reads, and it is text a
      # contributor chose: it reaches the script only through the environment,
      # never through the shell. The step warns and never fails.
      - name: Warn when the commit that landed is not a conventional commit
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
          if ! PR_TITLE="$subject" node tools/conventional-pr-title.mjs; then
            echo "::warning title=Not a conventional commit::release-please leaves the commit that landed out of the next release. The details are above."
          fi

      - name: Create or update the release pull request
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN" || { echo "release_tag_token_missing" >&2; exit 1; }
          npx --yes "release-please@$RELEASE_PLEASE_VERSION" release-pr \
            --token "$GITHUB_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --target-branch main \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json

  github-release:
    name: Tag the qa-proven release commit
    # Only a successful Deploy of this repository's own main branch can tag. The
    # head_repository pin keeps a fork's Deploy out; the conclusion pin means the
    # commit being tagged is one qa actually proved.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Deploy proves every push to main, so most Deploy successes are ordinary
      # commits that must not be tagged. Only the merge commit of the newest
      # merged release pull request is a release. This gate exits 0 without
      # tagging for everything else: a skipped tag is not a failure.
      - name: Require this Deploy run to be the merged release pull request
        id: release_commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --head release-please--branches--main \
            --json number,mergeCommit,mergedAt --limit 20 \
            > "$RUNNER_TEMP/release-prs.json"
          merge_commit="$(jq -r 'map(select(.mergedAt != null)) | sort_by(.mergedAt) | reverse | .[0].mergeCommit.oid // ""' "$RUNNER_TEMP/release-prs.json")"
          if [[ "$merge_commit" != "$DEPLOY_HEAD_SHA" ]]; then
            echo "not the merged release commit (newest release merge: ${merge_commit:-none}); nothing to tag"
            echo "tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=true" >> "$GITHUB_OUTPUT"

      - name: Tag the release commit and publish the GitHub release
        if: ${{ steps.release_commit.outputs.tag == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN" || { echo "release_tag_token_missing" >&2; exit 1; }
          npx --yes "release-please@$RELEASE_PLEASE_VERSION" github-release \
            --token "$GITHUB_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --target-branch main \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json
