<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#1b1e22" />
    <meta name="description" content="IronWrap OS - proof-first roofing operations." />
    <meta name="robots" content="noindex,nofollow" />
    <script async src="/field-bootstrap-preload.js"></script>
    <style>
      html {
        background: #f3f4f2;
        color: #15181c;
      }
      #app-boot-shell {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #1b1e22;
        font-family: "Archivo Variable", "Archivo", ui-sans-serif, system-ui, sans-serif;
      }
      #app-boot-shell > div {
        width: min(100%, 25rem);
        border: 1px solid #2e3339;
        border-radius: 0.75rem;
        background: #ffffff;
        padding: 1.5rem;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 8%),
          0 12px 40px rgb(8 12 16 / 22%);
      }
      #app-boot-shell p {
        margin: 0;
        color: #484e56;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      #app-boot-shell h1 {
        margin: 0.5rem 0;
        font-size: 1.5rem;
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.25;
        color: #15181c;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>IronWrap OS</title>
  </head>
  <body>
    <div id="app-boot-shell" role="status" aria-live="polite">
      <div>
        <p>IronWrap OS</p>
        <h1>Checking this field device</h1>
        <p>Verifying a trusted session before showing assigned work.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
