# amd64 override for x86_64 hosts - apply as a second -f file:
#
#   docker compose -f deploy/local/docker-compose.yml \
#                  -f deploy/local/docker-compose.amd64.yml --profile frappe up -d
#
# The base file pins linux/arm64 (the development topology is arm64-native);
# this override exists so an x86_64 host never edits the base file in place.
services:
  mariadb:
    platform: linux/amd64
  frappe-init:
    platform: linux/amd64
  frappe:
    platform: linux/amd64
